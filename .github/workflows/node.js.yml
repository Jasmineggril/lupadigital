name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Check database URL (prevent IPv6 direct Supabase)
      run: |
        echo "Running database URL sanity check..."
        node ./artifacts/api-server/scripts/check-database-url.js
    - run: pnpm install --frozen-lockfile --prod=false
    - run: pnpm typecheck
    - run: pnpm --filter @workspace/api-server run build
    - run: pnpm --filter @workspace/lupa-publica run build
    - run: pnpm --filter @workspace/api-server test
