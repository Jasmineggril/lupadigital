name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile --prod=false
    - run: pnpm typecheck
    - run: pnpm --filter @workspace/api-server run build
    - run: node scripts/check-serverless.mjs
    - run: pnpm --filter @workspace/lupa-publica run build
    - run: pnpm --filter @workspace/api-server test
    - run: pnpm --filter @workspace/lupa-publica test

  # Segurança: auditoria de dependências com política explícita; migrações num Postgres 17 limpo
  # (mesma versão principal de produção), aplicadas DUAS vezes (idempotência); RLS ligada em todas as
  # tabelas; isolamento A/B por RLS; atomicidade dos limites compartilhados com duas conexões.
  # Banco descartável do próprio job — nada de produção.
  seguranca:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lupa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgres://postgres:ci@127.0.0.1:5432/lupa_ci
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile --prod=false
    - name: Auditoria de dependências (política e exceções com vencimento)
      run: node scripts/security/audit-policy.mjs
    - name: Migrações em banco limpo, duas vezes
      run: |
        psql "$PGURL" -q -v ON_ERROR_STOP=1 -f scripts/security/ci-db-bootstrap.sql
        for pass in 1 2; do
          for f in supabase/migrations/*.sql; do psql "$PGURL" -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null; done
          echo "passada $pass ok"
        done
        n=$(psql "$PGURL" -tA -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and relkind='r' and not relrowsecurity")
        test "$n" = "0" || { echo "tabelas sem RLS: $n"; exit 1; }
    - name: Isolamento A/B por RLS
      run: |
        psql "$PGURL" -q -v ON_ERROR_STOP=1 -f scripts/security/local-supabase-grants.sql
        LUPA_ALLOW_RLS_TEST=sim DATABASE_URL="$PGURL" node scripts/security/rls-isolation.mjs
    - name: Análises longas — reserva atômica no Postgres (20 processadores)
      run: LUPA_ALLOW_RLS_TEST=sim DATABASE_URL="$PGURL" node scripts/security/longdoc-claim.mjs
    - name: Limites compartilhados (atomicidade real, duas conexões)
      run: pnpm --filter @workspace/api-server exec vitest run src/lib/limits
      env:
        LUPA_TEST_PG_URL: ${{ env.PGURL }}

  supabase-preview:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL_IPV4: ${{ secrets.DIRECT_URL_IPV4 }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile --prod=false
    - if: ${{ env.SUPABASE_URL != '' && (env.SUPABASE_SERVICE_ROLE_KEY != '' || env.SUPABASE_SECRET_KEY != '') && env.VITE_SUPABASE_URL != '' && env.VITE_SUPABASE_ANON_KEY != '' && (env.DATABASE_URL != '' || env.DIRECT_URL != '' || env.DIRECT_URL_IPV4 != '') }}
      run: pnpm --filter @workspace/api-server exec tsx src/scripts/validate-supabase.ts
    - if: ${{ env.DATABASE_URL != '' || env.DIRECT_URL != '' || env.DIRECT_URL_IPV4 != '' }}
      run: pnpm --filter @workspace/api-server exec tsx src/scripts/validate-db.ts

  # Jornadas críticas no navegador (Chromium), em pilha de TESTE isolada e reprodutível:
  # auth de teste + API real com banco em memória de testes + build estático + coleta com fixtures.
  # Não usa banco, Auth nem IA de produção; não acessa a rede externa. Falha se qualquer jornada falhar.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile --prod=false
    - run: pnpm typecheck
    - run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium
    - name: Jornadas (testar, docente, integradas, regressão P1–P8)
      run: bash scripts/e2e/run-all.sh --build
      env:
        E2E_OUT: e2e-out
        E2E_TIMEOUT: "20000"
    - name: Resumo e validações NÃO verificadas por este job
      if: always()
      run: |
        {
          echo "## Jornadas de navegador (ambiente de teste)"
          echo '```'; cat e2e-out/resumo.txt 2>/dev/null || echo "sem resumo"; echo '```'
          echo "### Não verificadas aqui"
          echo "- Banco, Auth e IA de produção (Supabase/OpenAI): o job usa banco em memória, auth de teste e plano de IA fictício."
          echo "- Coleta real no site da FAPDF e documentos reais (o job usa páginas e PDFs fictícios)."
          echo "- OCR de PDF escaneado (não configurado no servidor)."
          echo "- Integrações Hermes e eLattes (não existem)."
          echo "- Dispositivos físicos, Android/iOS, leitores de tela (NVDA, TalkBack, VoiceOver), Libras/VLibras."
          echo "- axe-core cobre só regras automáticas; validação humana de acessibilidade continua pendente."
        } >> "$GITHUB_STEP_SUMMARY"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-capturas
        path: |
          e2e-out/
          /tmp/lupa-e2e/*.log
        retention-days: 14
        if-no-files-found: warn
