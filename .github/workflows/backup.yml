# Backup lógico criptografado do banco (scripts/ops/backup.sh).
# SÓ MANUAL por enquanto: o agendamento abaixo fica comentado até a pessoa responsável aprovar
# local de guarda, retenção e quem tem acesso (o arquivo contém dados pessoais, criptografados).
# Sem os secrets DATABASE_URL (conexão direta, Postgres 17) e BACKUP_PASSPHRASE, o job não faz nada.
name: Backup do banco
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "23 6 * * *"   # diário, 03:23 em Brasília (pendente de aprovação)
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ env.DATABASE_URL == '' || env.BACKUP_PASSPHRASE == '' }}
        run: echo "Secrets DATABASE_URL e BACKUP_PASSPHRASE não configurados — nada a fazer." >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ env.DATABASE_URL != '' && env.BACKUP_PASSPHRASE != '' }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          PATH=/usr/lib/postgresql/17/bin:$PATH bash scripts/ops/backup.sh backups
      - if: ${{ env.DATABASE_URL != '' && env.BACKUP_PASSPHRASE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-criptografado
          path: backups/
          retention-days: 7
